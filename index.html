<style>
  :root { --bg: #0c0716; --panel: #150d24; --line: #2f2145; --text: #f1e9ff; --muted: #a595c4; --primary: #b44dff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: "Chakra Petch", system-ui, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); padding: 28px 24px;
         clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  h1 { font-weight: 700; font-size: 28px; line-height: 1; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  input[type=password] { width: 100%; padding: 12px 14px; font-size: 16px; background: var(--bg); color: var(--text);
         border: 1px solid var(--line); outline: none; }
  input[type=password]:focus { border-color: var(--primary); }
  label.lembrar { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; color: var(--muted); font-size: 14px; }
  button { width: 100%; padding: 12px; border: 0; background: linear-gradient(90deg, #b44dff, #ff4fd8); color: #12081f; cursor: pointer;
           font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: #ff4d6d; min-height: 20px; margin: 12px 0 0; font-size: 14px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Painel financeiro</h1>
  <p>Digite a senha para abrir.</p>
  <input id="senha" type="password" aria-label="Senha" autofocus required>
  <label class="lembrar"><input id="lembrar" type="checkbox"> Lembrar neste aparelho</label>
  <button id="btn" type="submit">Abrir</button>
  <p class="erro" id="erro" role="alert"></p>
</form>

const CHAVE_LS = 'painel-senha';
const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(PACOTE.salt), iterations: PACOTE.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PACOTE.iv) }, chave, bytes(PACOTE.data));
  return new TextDecoder().decode(claro);
}

function mostrar(html) {
  document.open();
  document.write(html);
  document.close();
}

const f = document.getElementById('f'), erro = document.getElementById('erro'), btn = document.getElementById('btn');
f.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const senha = document.getElementById('senha').value;
  btn.disabled = true; erro.textContent = '';
  try {
    const html = await abrir(senha);
    try { if (document.getElementById('lembrar').checked) localStorage.setItem(CHAVE_LS, senha); } catch (e) {}
    mostrar(html);
  } catch (e) {
    erro.textContent = 'Senha incorreta. Confira e tente de novo.';
    btn.disabled = false;
  }
});

(async () => {
  let salva = null;
  try { salva = localStorage.getItem(CHAVE_LS); } catch (e) {}
  if (!salva) return;
  try { mostrar(await abrir(salva)); }
  catch (e) { try { localStorage.removeItem(CHAVE_LS); } catch (e2) {} }
})();
</script>
